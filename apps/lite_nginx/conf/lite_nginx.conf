worker_processes 2;

logging {
    appender access_stdout {
        type console;
        stream stdout;
        min_level info;
        max_level info;
    }

    appender stderr {
        type console;
        stream stderr;
        min_level info;
    }

    logger lite_nginx.access {
        level info;
        appender access_stdout;
        additive off;
    }

    root_logger {
        level info;
        appender stderr;
    }
}

http {
    listen 8080;
    listen 8443 ssl http3;
    access_log lite_nginx.access "request_id=${$access.request_id} remote_addr=${$conn.remote_addr} method=${$req.method} path=${$req.path} protocol=${$conn.http_version} status=${$access.status} body_bytes_sent=${$access.body_bytes_sent} request_time_us=${$access.request_time_us} outcome=${$access.outcome}";

    connection_pool {
        keepalive_size 1024;
        keepalive_timeout 30s;
        steal auto; # on when worker_processes > 1, else per-loop local pools
        # max_idle_total 65536;       # total idle cap across all peer groups (0/omitted => keepalive_size * 64)
        # initial_group_capacity 16;  # per-group hash table seed capacity (0/omitted => 16)
    }

    upstream backend {
        server 127.0.0.1:9001 weight=3;
        server http://127.0.0.1:9002 weight=1;
        # server https://example.com:443 weight=1; # hostname peer: resolved via DNS at connect time
        connect_timeout 3s;
        read_timeout 30s;
        send_timeout 30s;
    }

    server {
        server_name localhost;
        certificate ../../../build/http3-demo/cert.pem;
        certificate_key ../../../build/http3-demo/key.pem;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host backend.internal;

        # Script locations: the request is handled by a compiled script (req.*/resp.*)
        # instead of being proxied. script_file is mutually exclusive with proxy_pass.
        # File paths are absolute or relative to THIS config file's directory (never
        # the process working directory); the scripts below sit next to this conf under
        # conf/scripts/.

        location /health {
            access_log off;
            script_file scripts/health.js;
        }

        location /echo {
            script_file scripts/echo.js;
        }

        location /inspect {
            script_file scripts/inspect.js;
        }

        # /api/:id captures the :id path segment (exposed as $path.id in vars.js). A bare
        # pattern like /inspect or /health matches exactly that path; :name captures one
        # segment, and /* is the trailing-wildcard catch-all.
        location /api/:id {
            script_file scripts/vars.js;
        }

        location /* {
            proxy_pass http://backend;
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffering off;
        }
    }
}
