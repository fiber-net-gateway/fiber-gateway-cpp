worker_processes 2;

http {
    listen 8080;
    listen 8443 ssl http3;

    connection_pool {
        keepalive_size 1024;
        keepalive_timeout 30s;
        steal auto; # on when worker_processes > 1, else per-loop local pools
        # max_idle_total 65536;       # total idle cap across all peer groups (0/omitted => keepalive_size * 64)
        # initial_group_capacity 16;  # per-group hash table seed capacity (0/omitted => 16)
    }

    upstream backend {
        server 127.0.0.1:9001 weight=3;
        server http://127.0.0.1:9002 weight=1;
        # server https://example.com:443 weight=1; # hostname peer: resolved via DNS at connect time
        connect_timeout 3s;
        read_timeout 30s;
        send_timeout 30s;
    }

    server {
        server_name localhost;
        certificate build/http3-demo/cert.pem;
        certificate_key build/http3-demo/key.pem;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host backend.internal;

        # Script locations: the request is handled by a compiled script (req.*/resp.*)
        # instead of being proxied. script_file is mutually exclusive with proxy_pass.
        # Paths are resolved relative to the working directory the server is run from;
        # run from the repo root, these resolve under apps/lite_nginx/conf/scripts/.

        location /health {
            script_file apps/lite_nginx/conf/scripts/health.js;
        }

        location /echo {
            script_file apps/lite_nginx/conf/scripts/echo.js;
        }

        location /inspect {
            script_file apps/lite_nginx/conf/scripts/inspect.js;
        }

        # /api/:id captures the :id path segment (exposed as $path.id in vars.js). A bare
        # pattern like /inspect or /health matches exactly that path; :name captures one
        # segment, and /* is the trailing-wildcard catch-all.
        location /api/:id {
            script_file apps/lite_nginx/conf/scripts/vars.js;
        }

        location /* {
            proxy_pass http://backend;
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffering off;
        }
    }
}

