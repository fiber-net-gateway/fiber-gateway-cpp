worker_processes 2;

http {
    listen 8080;
    listen 8443 ssl http3;

    connection_pool {
        keepalive_size 1024;
        keepalive_timeout 30s;
    }

    upstream backend {
        server 127.0.0.1:9001 weight=3;
        server 127.0.0.1:9002 weight=1;
        connect_timeout 3s;
        read_timeout 30s;
        send_timeout 30s;
    }

    server {
        server_name localhost;
        certificate build/http3-demo/cert.pem;
        certificate_key build/http3-demo/key.pem;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host backend.internal;

        # Script locations: the request is handled by a compiled script (req.*/resp.*)
        # instead of being proxied. script_file is mutually exclusive with proxy_pass.
        # Paths are resolved relative to the working directory the server is run from;
        # run from the repo root, these resolve under apps/lite_nginx/conf/scripts/.

        location /health {
            script_file apps/lite_nginx/conf/scripts/health.js;
        }

        location /echo {
            script_file apps/lite_nginx/conf/scripts/echo.js;
        }

        location = /inspect {
            script_file apps/lite_nginx/conf/scripts/inspect.js;
        }

        location /* {
            proxy_pass http://backend;
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffering off;
        }
    }
}

