worker_processes 4;

http {
    listen 8080;
    listen 8443 ssl;

    upstream backend {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        keepalive 64;
        connect_timeout 3s;
        read_timeout 30s;
        send_timeout 30s;
    }

    server {
        server_name localhost;
        certificate /etc/lite-nginx/localhost.crt;
        certificate_key /etc/lite-nginx/localhost.key;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_set_header Host backend.internal;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header X-Forwarded-Proto http;
            proxy_buffering off;
        }
    }
}
