syntax = "proto3";

package fiber.nacos.proto;

option optimize_for = LITE_RUNTIME;

// Wire-equivalent subset of google.protobuf.Any. Nacos leaves type_url empty
// and only uses value; declaring it locally keeps this target on protobuf lite.
message Any {
  string type_url = 1;
  bytes value = 2;
}

message Metadata {
  string type = 3;
  map<string, string> headers = 7;
  string clientIp = 8;
}

message Payload {
  Metadata metadata = 2;
  Any body = 3;
}
