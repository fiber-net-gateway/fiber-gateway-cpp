worker_processes 2;

error_log temp/http-benchmark-runtime/openresty-error.log error;
pid temp/http-benchmark-runtime/openresty.pid;

events {
    worker_connections 8192;
    multi_accept off;
}

http {
    access_log off;
    default_type application/octet-stream;
    keepalive_timeout 70s;
    keepalive_requests 1000000;

    client_body_temp_path temp/http-benchmark-runtime/client-body;
    proxy_temp_path temp/http-benchmark-runtime/proxy;

    upstream benchmark_backend {
        server 127.0.0.1:29001;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 127.0.0.1:28080;
        listen 127.0.0.1:28443 ssl;
        listen 127.0.0.1:28443 quic reuseport;
        http2 on;
        http2_max_concurrent_streams 128;
        http3 on;
        http3_max_concurrent_streams 128;
        http3_stream_buffer_size 64k;
        quic_retry off;
        quic_gso off;
        server_name localhost 127.0.0.1;

        ssl_certificate ../../../../build/http3-demo/cert.pem;
        ssl_certificate_key ../../../../build/http3-demo/key.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache off;

        location / {
            proxy_pass http://benchmark_backend;
            proxy_http_version 1.1;
            proxy_set_header Host benchmark-backend;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
