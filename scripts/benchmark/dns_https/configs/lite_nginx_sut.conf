worker_processes 2;

http {
    listen 127.0.0.1:18080;
    access_log off;

    # Per-loop pool: this matches Nginx's per-worker keepalive cache.
    connection_pool {
        keepalive_size 256;
        keepalive_timeout 60s;
        steal off;
        max_idle_total 256;
        initial_group_capacity 16;
    }

    upstream dns_https_backend {
        server https://backend-long.dns-bench.test:19443;
        connect_timeout 3s;
        read_timeout 10s;
        send_timeout 10s;
    }

    server {
        server_name localhost 127.0.0.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host backend-long.dns-bench.test;

        location /* {
            access_log off;
            proxy_pass http://dns_https_backend;
            proxy_buffering off;
        }
    }
}
