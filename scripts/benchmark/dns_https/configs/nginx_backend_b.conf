user root;
worker_processes 2;

error_log temp/dns-https-benchmark-runtime/backend-b-error.log error;
pid temp/dns-https-benchmark-runtime/backend-b.pid;

events {
    worker_connections 8192;
    multi_accept off;
}

http {
    access_log off;
    default_type application/octet-stream;

    client_body_temp_path temp/dns-https-benchmark-runtime/backend-b-client-body;
    proxy_temp_path temp/dns-https-benchmark-runtime/backend-b-proxy;

    upstream benchmark_origin {
        server 127.0.0.1:19001;
        keepalive 512;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 127.0.0.2:19443 ssl;
        server_name backend-short.dns-bench.test
                    backend-switch.dns-bench.test
                    backend-fallback.dns-bench.test;

        ssl_certificate ../../../../build/http3-demo/cert.pem;
        ssl_certificate_key ../../../../build/http3-demo/key.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache off;
        ssl_session_tickets off;
        keepalive_timeout 70s;
        keepalive_requests 1000000;

        location / {
            proxy_pass http://benchmark_origin;
            proxy_http_version 1.1;
            proxy_set_header Host benchmark-origin;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            add_header X-Benchmark-Backend B always;
            add_header X-Benchmark-Upstream-SNI $ssl_server_name always;
        }
    }
}
