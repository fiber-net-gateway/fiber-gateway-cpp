user root;
worker_processes 2;

error_log temp/dns-https-benchmark-runtime/nginx-sut-error.log error;
pid temp/dns-https-benchmark-runtime/nginx-sut.pid;

events {
    worker_connections 8192;
    multi_accept off;
}

http {
    access_log off;
    default_type application/octet-stream;
    keepalive_timeout 70s;
    keepalive_requests 1000000;

    client_body_temp_path temp/dns-https-benchmark-runtime/nginx-sut-client-body;
    proxy_temp_path temp/dns-https-benchmark-runtime/nginx-sut-proxy;

    upstream dns_https_backend {
        zone dns_https_backend 64k;
        resolver 127.0.0.53:53 ipv6=on;
        resolver_timeout 4s;
        server backend-long.dns-bench.test:19443 resolve;
        keepalive 256;
        keepalive_requests 1000000;
        keepalive_timeout 60s;
    }

    server {
        listen 127.0.0.1:18080;
        server_name localhost 127.0.0.1;

        location / {
            proxy_pass https://dns_https_backend;
            proxy_http_version 1.1;
            proxy_set_header Host backend-long.dns-bench.test;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_ssl_server_name on;
            proxy_ssl_name backend-long.dns-bench.test;
            proxy_ssl_protocols TLSv1.3;
            proxy_ssl_verify off;

            # The normalized comparison forces a full upstream TLS handshake,
            # matching lite-nginx's lack of a cross-connection TLS session cache.
            proxy_ssl_session_reuse off;
        }
    }
}
