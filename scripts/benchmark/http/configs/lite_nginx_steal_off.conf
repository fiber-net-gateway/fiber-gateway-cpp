worker_processes 2;

http {
    listen 127.0.0.1:18080;
    listen 127.0.0.1:18443 ssl;
    access_log off;

    connection_pool {
        keepalive_size 256;
        keepalive_timeout 60s;
        steal off;
        max_idle_total 256;
        initial_group_capacity 16;
    }

    upstream benchmark_backend {
        server 127.0.0.1:19001;
        connect_timeout 3s;
        read_timeout 10s;
        send_timeout 10s;
    }

    server {
        server_name localhost 127.0.0.1;
        certificate ../../../../build/http3-demo/cert.pem;
        certificate_key ../../../../build/http3-demo/key.pem;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_set_header Host benchmark-backend;

        location /* {
            access_log off;
            proxy_pass upstream://benchmark_backend;
            proxy_buffering off;
        }
    }
}
