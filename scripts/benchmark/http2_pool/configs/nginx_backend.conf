# Run from the repository root with -p "$PWD/".
# Fixture preparation and scenario overrides are documented in
# feature/local_http2_connection_pool_set_stress_plan.md.
worker_processes 2;
pid build/http2-pool-bench/nginx.pid;
error_log build/http2-pool-bench/error.log notice;

events {
    worker_connections 4096;
}

http {
    default_type application/octet-stream;
    sendfile on;
    gzip off;
    root build/http2-pool-bench/www;

    client_body_temp_path build/http2-pool-bench/client_body;
    proxy_temp_path build/http2-pool-bench/proxy;
    fastcgi_temp_path build/http2-pool-bench/fastcgi;
    uwsgi_temp_path build/http2-pool-bench/uwsgi;
    scgi_temp_path build/http2-pool-bench/scgi;

    log_format pool_bench escape=json
        '{"time":"$msec","pid":"$pid","connection":"$connection",'
        '"connection_requests":"$connection_requests","port":"$server_port",'
        '"protocol":"$server_protocol","request_id":"$http_x_bench_id",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time}';
    access_log build/http2-pool-bench/access.jsonl pool_bench buffer=64k flush=1s;

    http2 on;
    http2_max_concurrent_streams 128;
    keepalive_requests 1000000000;
    keepalive_time 24h;
    keepalive_timeout 75s;

    add_header X-Bench-Id $http_x_bench_id always;
    add_header X-Backend-Port $server_port always;
    add_header X-Backend-Protocol $server_protocol always;

    server {
        listen 127.0.0.1:18082;
        server_name localhost;

        location / {
            try_files $uri =404;
        }

        location = /slow.bin {
            limit_rate 64k;
            try_files /large.bin =404;
        }
    }

    # A distinct group with a lower peer stream limit.
    server {
        listen 127.0.0.1:18083;
        server_name localhost;
        http2_max_concurrent_streams 1;

        location / {
            try_files $uri =404;
        }

        location = /slow.bin {
            limit_rate 64k;
            try_files /large.bin =404;
        }
    }
}
