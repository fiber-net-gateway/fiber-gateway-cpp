# nginx echo backend for lite_nginx testing.
#
# Serves plain-HTTP echo responses on 9001 and 9002 — the upstream ports
# referenced by apps/lite_nginx/conf/lite_nginx.conf:
#
#     upstream backend {
#         server 127.0.0.1:9001;
#         server 127.0.0.1:9002;
#     }
#
# Build (already done) lives in temp/nginx-install and was compiled with
# --with-http_ssl_module --with-http_v2_module --with-http_v3_module against
# the project's BoringSSL, so TLS/HTTP2/HTTP3 are available if you later want
# to add `listen ... ssl` / `http2` / `quic` listeners.
#
# Run:
#     temp/nginx-install/sbin/nginx -p temp/nginx-install -c scripts/nginx.conf
# Stop:
#     temp/nginx-install/sbin/nginx -p temp/nginx-install -c scripts/nginx.conf -s stop
# Verify:
#     curl http://127.0.0.1:9001/anything?x=1
#     curl http://127.0.0.1:9002/hello

worker_processes  4;

# Absolute paths so the config runs regardless of cwd / prefix.
error_log  /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/error.log notice;
pid        /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  text/plain;

    access_log  /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/access.log;

    # Temp paths (absolute — independent of the prefix passed to `nginx -p`).
    client_body_temp_path  /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/client_body_temp;
    proxy_temp_path        /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/proxy_temp;
    fastcgi_temp_path      /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/fastcgi_temp;
    uwsgi_temp_path        /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/uwsgi_temp;
    scgi_temp_path         /software/Code/fiber-gateway-cpp/temp/nginx-install/logs/scgi_temp;

    # Keep connections alive from lite_nginx's proxy (reuse upstream keepalive).
    keepalive_timeout  65s;

    server {
        # Both backend ports handled by one server; $server_port tells them apart.
        listen  9001;
        listen  9002;
        server_name  _;

        add_header  X-Backend-Port  $server_port always;

        # Echo back enough context to verify proxy forwarding / load balancing.
        location / {
            return 200 "echo from backend :$server_port\nmethod=$request_method\nuri=$uri\nargs=$args\nhost=$http_host\nua=$http_user_agent\n";
        }
    }
}
