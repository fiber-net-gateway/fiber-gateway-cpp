# nginx debug server for lite_nginx testing.
#
# Serves plain-HTTP debug responses on 9001 and 9002 — the upstream ports
# referenced by apps/lite_nginx/conf/lite_nginx.conf:
#
#     upstream backend {
#         server 127.0.0.1:9001;
#         server 127.0.0.1:9002;
#     }
#
# Build:
#     scripts/build_nginx.sh
# Run from the project root:
#     temp/nginx-install/sbin/nginx -p "$PWD/" -c scripts/nginx.conf
# Stop:
#     temp/nginx-install/sbin/nginx -p "$PWD/" -c scripts/nginx.conf -s stop
# Verify:
#     curl -i http://127.0.0.1:9001/
#     curl -i http://127.0.0.1:9002/
#     curl -i --http2 -k https://localhost:9443/
#     curl -i --http3-only -k https://localhost:9443/

worker_processes  4;

error_log  temp/nginx-install/logs/error.log notice;
pid        temp/nginx-install/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    default_type  text/plain;

    access_log  temp/nginx-install/logs/access.log;

    client_body_temp_path  temp/nginx-install/logs/client_body_temp;
    proxy_temp_path        temp/nginx-install/logs/proxy_temp;
    fastcgi_temp_path      temp/nginx-install/logs/fastcgi_temp;
    uwsgi_temp_path        temp/nginx-install/logs/uwsgi_temp;
    scgi_temp_path         temp/nginx-install/logs/scgi_temp;

    # Keep connections alive from lite_nginx's proxy (reuse upstream keepalive).
    keepalive_timeout  65s;

    server {
        # Both backend ports handled by one server; $server_port tells them apart.
        listen  9001;
        listen  9002;
        server_name  _;

        add_header  X-Backend-Port  $server_port always;

        location / {
            root       scripts;
            try_files  /nginx-debug.txt =404;
        }
    }

    # TLS on TCP negotiates HTTP/1.1 or HTTP/2; QUIC on UDP serves HTTP/3.
    server {
        listen  9443 ssl;
        listen  9443 quic reuseport;
        http2  on;
        http3  on;
        server_name  localhost;

        ssl_certificate      ../build/http3-demo/cert.pem;
        ssl_certificate_key  ../build/http3-demo/key.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;

        add_header  Alt-Svc          'h3=":9443"; ma=86400' always;
        add_header  X-Debug-Protocol  $server_protocol always;

        location / {
            root       scripts;
            try_files  /nginx-debug.txt =404;
        }
    }
}
